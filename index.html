<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>オンライン講座 お申し込み</title>

  <script
    charset="utf-8"
    src="https://static.line-scdn.net/liff/edge/2/sdk.js">
  </script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 24px 16px;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Helvetica Neue",
        "Yu Gothic",
        "Meiryo",
        sans-serif;
      background: #fff7fa;
      color: #333;
    }

    .container {
      width: 100%;
      max-width: 520px;
      margin: 0 auto;
    }

    .card {
      background: #ffffff;
      border-radius: 18px;
      padding: 28px 22px;
      box-shadow: 0 4px 18px rgba(0,0,0,0.08);
    }

    h1 {
      margin: 0 0 10px;
      text-align: center;
      font-size: 25px;
      color: #d96c98;
    }

    .lead {
      margin: 0 0 26px;
      text-align: center;
      font-size: 16px;
      line-height: 1.7;
    }

    .status {
      background: #fff7df;
      border-radius: 10px;
      padding: 12px;
      margin-bottom: 18px;
      text-align: center;
      font-size: 14px;
      line-height: 1.6;
    }

    .course-box {
      background: #fff1f6;
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 24px;
    }

    .course-label {
      font-size: 14px;
      color: #777;
      margin-bottom: 5px;
    }

    .course-name {
      font-size: 20px;
      font-weight: bold;
      color: #444;
    }

    label {
      display: block;
      margin: 18px 0 7px;
      font-size: 16px;
      font-weight: bold;
    }

    .required {
      color: #d94c76;
      font-size: 13px;
      margin-left: 5px;
    }

    input {
      width: 100%;
      padding: 14px;
      border: 1px solid #ccc;
      border-radius: 10px;
      font-size: 17px;
      background: #fff;
    }

    input:focus {
      outline: 2px solid #efb2ca;
      border-color: #efb2ca;
    }

    button {
      width: 100%;
      margin-top: 28px;
      padding: 16px;
      border: 0;
      border-radius: 12px;
      background: #e894b5;
      color: #fff;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .note {
      margin-top: 18px;
      text-align: center;
      color: #666;
      font-size: 14px;
      line-height: 1.6;
    }
  </style>
</head>

<body>

  <div class="container">
    <div class="card">

      <h1>オンライン講座 お申し込み</h1>

      <p class="lead">
        必要事項をご入力ください。
      </p>

      <div class="status" id="status">
        LINE情報を読み込んでいます…
      </div>

      <div class="course-box">
        <div class="course-label">お申し込み講座</div>
        <div class="course-name" id="courseName">
          講座情報を確認中です
        </div>
      </div>

      <form id="applicationForm">

        <label for="name">
          お名前
          <span class="required">必須</span>
        </label>

        <input
          type="text"
          id="name"
          name="name"
          autocomplete="name"
          required
        >

        <label for="email">
          メールアドレス
          <span class="required">必須</span>
        </label>

        <input
          type="email"
          id="email"
          name="email"
          autocomplete="email"
          required
        >

        <label for="phone">
          電話番号
          <span class="required">必須</span>
        </label>

        <input
          type="tel"
          id="phone"
          name="phone"
          autocomplete="tel"
          required
        >

        <button
          type="submit"
          id="submitButton"
          disabled>
          申し込む
        </button>

      </form>

      <div class="note">
        お申し込み後、LINEに受付完了のご案内をお送りします。
      </div>

    </div>
  </div>

  <script>
    const LIFF_ID = "2009804816-86czIDFV";

    let lineIdToken = "";
    let courseId = "";

    const courseNames = {
      SP202609: "スマホ勉強会",
      PC202609: "パソコン勉強会",
      SALON202609: "オンラインパソコン＆スマホサロン"
    };

    function getCourseId() {
      const urlParams =
        new URLSearchParams(window.location.search);

      let id = urlParams.get("course");

      if (!id) {
        const liffState =
          urlParams.get("liff.state");

        if (liffState) {
          const decoded =
            decodeURIComponent(liffState);

          const stateParams =
            new URLSearchParams(
              decoded.startsWith("?")
                ? decoded.substring(1)
                : decoded
            );

          id = stateParams.get("course");
        }
      }

      return id || "";
    }

    async function initializeLiff() {
      const status =
        document.getElementById("status");

      const submitButton =
        document.getElementById("submitButton");

      try {
        await liff.init({
          liffId: LIFF_ID
        });

        if (!liff.isLoggedIn()) {
          liff.login();
          return;
        }

        lineIdToken =
          liff.getIDToken() || "";

        courseId =
          getCourseId();

        const courseName =
          courseNames[courseId];

        if (courseName) {
          document.getElementById(
            "courseName"
          ).textContent = courseName;
        } else {
          document.getElementById(
            "courseName"
          ).textContent =
            "講座を確認できませんでした";
        }

        if (!lineIdToken) {
          throw new Error(
            "LINE情報を取得できませんでした。"
          );
        }

        status.textContent =
          "LINEとの接続が完了しました。";

        submitButton.disabled =
          !courseName;

      } catch (error) {
        console.error(error);

        status.textContent =
          "LINEとの接続中にエラーが発生しました。";
      }
    }

    const BACKEND_URL =
  "https://script.google.com/macros/s/AKfycbyNDO0LqunUtRDyzpOEbt7t583Rtwa--oKb2yLMVI7WXhcNgrrLI80uJiPO89y7QOE/exec";

document
  .getElementById("applicationForm")
  .addEventListener(
    "submit",
    async function(event) {

      event.preventDefault();

      const submitButton =
        document.getElementById("submitButton");

      submitButton.disabled = true;
      submitButton.textContent = "送信中…";

      try {

        const formData =
          new URLSearchParams();

        formData.append(
          "courseId",
          courseId
        );

        formData.append(
          "name",
          document.getElementById("name").value.trim()
        );

        formData.append(
          "email",
          document.getElementById("email").value.trim()
        );

        formData.append(
          "phone",
          document.getElementById("phone").value.trim()
        );

        formData.append(
          "lineIdToken",
          lineIdToken
        );

        const iframe =
  document.createElement("iframe");

iframe.name = "hiddenSubmitFrame";
iframe.style.display = "none";

document.body.appendChild(iframe);


const postForm =
  document.createElement("form");

postForm.method = "POST";
postForm.action = BACKEND_URL;
postForm.target = "hiddenSubmitFrame";
postForm.style.display = "none";


for (const [key, value] of formData.entries()) {

  const input =
    document.createElement("input");

  input.type = "hidden";
  input.name = key;
  input.value = value;

  postForm.appendChild(input);
}


document.body.appendChild(postForm);

postForm.submit();


setTimeout(function() {

  postForm.remove();
  iframe.remove();

}, 5000);

        alert(
          "お申し込みを送信しました。\n" +
          "受付内容を確認しています。"
        );

        submitButton.textContent =
          "送信しました";

      } catch (error) {

        console.error(error);

        alert(
          "送信できませんでした。\n" +
          "もう一度お試しください。"
        );

        submitButton.disabled = false;
        submitButton.textContent =
          "申し込む";
      }
    }
  );

    initializeLiff();
  </script>

</body>
</html>
